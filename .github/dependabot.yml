version: 2

# Grouping is mandatory here, not cosmetic: this repo accumulated 81 open
# Dependabot alerts before any config existed. Ungrouped, that is ~80 PRs.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns: ['*']
      npm-security-updates:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
