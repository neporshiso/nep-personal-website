name: CI

# Keystatic runs in GitHub mode in production and commits straight to `main`
# with no human in the loop. Those commits cannot be reviewed before they land,
# so this workflow is the only place a bad one gets caught.
on:
  push:
    branches: [main]

# Read-only. This workflow must never write to the repo, open PRs, or deploy.
permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # No `version:` on purpose — action-setup reads the exact pinned pnpm
      # from the `packageManager` field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # engines.node floor, and the runtime Vercel actually deploys to.
          node-version: '22.12.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # --- Gating steps -------------------------------------------------
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # --- Non-gating -----------------------------------------------------
      # `astro check` reports 3 pre-existing errors as of HARDEN-003, so it
      # reports without gating. Fixing them is a follow-up ticket; once the
      # count is 0, delete `continue-on-error` to make this a gating step.
      - name: Type check (non-gating)
        run: pnpm exec astro check
        continue-on-error: true
